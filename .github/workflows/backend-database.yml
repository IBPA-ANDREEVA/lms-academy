name: Backend database foundation

on:
  pull_request:
    paths: ["backend/**", "docs/architecture/database/**", ".github/workflows/backend-database.yml"]
  push:
    paths: ["backend/**", "docs/architecture/database/**", ".github/workflows/backend-database.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv and isolated PostgreSQL tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential bison flex pkg-config
          python -m venv "$RUNNER_TEMP/lms-tools"
          "$RUNNER_TEMP/lms-tools/bin/pip" install uv==0.13.7
          echo "$RUNNER_TEMP/lms-tools/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.bz2 -o postgresql-18.6.tar.bz2
          echo '555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f  postgresql-18.6.tar.bz2' | sha256sum -c -
          tar -xjf postgresql-18.6.tar.bz2
          cd postgresql-18.6
          ./configure --prefix="$RUNNER_TEMP/lms-pg" --without-icu --without-readline --without-zlib
          make -j2
          make install
          echo "POSTGRES_BIN=$RUNNER_TEMP/lms-pg/bin" >> "$GITHUB_ENV"
      - name: Locked dependencies and quality
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run python scripts/schema_docs.py --check
      - name: Real isolated PostgreSQL migrations, constraints and recovery
        working-directory: backend
        run: uv run python scripts/verify_postgres.py
